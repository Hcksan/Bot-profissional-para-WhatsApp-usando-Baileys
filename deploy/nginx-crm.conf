# CRM Pessoal — __DOMAIN__ (origem atrás da Cloudflare)
# Instalado por deploy/install.sh. Os marcadores __DOMAIN__, __PORT__, __SSL_CERT__ e __SSL_KEY__ são trocados na instalação.

# WebSocket (atualizações em tempo real do painel)
map $http_upgrade $crm_connection_upgrade {
    default upgrade;
    ""      close;
}

# 1 = a conexão chegou de um servidor da Cloudflare (lista em /etc/nginx/snippets/crm-cloudflare-ips.conf)
geo $realip_remote_addr $crm_from_cloudflare {
    default 0;
    include /etc/nginx/snippets/crm-cloudflare-geo.conf;
}

# Limite de requisições ao login (por IP real do visitante)
limit_req_zone $binary_remote_addr zone=crm_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;

    # IP real do visitante (enviado pela Cloudflare em CF-Connecting-IP)
    include /etc/nginx/snippets/crm-cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # Só aceita tráfego que passou pela Cloudflare (ninguém acessa a VM direto pelo IP)
    if ($crm_from_cloudflare = 0) {
        return 403;
    }

    # Redireciona para HTTPS sem entrar em loop com a Cloudflare
    set $crm_need_https 0;
    if ($scheme = http) { set $crm_need_https 1; }
    if ($http_x_forwarded_proto = https) { set $crm_need_https 0; }
    if ($crm_need_https = 1) { return 301 https://$host$request_uri; }

    # Importação de planilhas
    client_max_body_size 30m;

    location = /api/login {
        limit_req zone=crm_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/crm-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/crm-proxy.conf;
    }
}
